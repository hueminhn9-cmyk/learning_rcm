<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aegis Learn - Hệ Thống Quản Lý & Hỗ Trợ Học Tập</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' }
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDNs with Fallbacks -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/umd/lucide.min.js"></script>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('aegis_theme') || 'light';
      if (savedTheme === 'light') {
        document.documentElement.classList.add('theme-light');
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('theme-light');
      }
    })();
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* ============================================================
       1. TRIỆT TIÊU TOÀN BỘ MÀU OMBRE / GRADIENTS TRÊN TOÀN HỆ THỐNG
       ============================================================ */
    *, *::before, *::after {
      background-image: none !important;
    }

    /* Tối giản đổ bóng: không dùng bóng màu neon glowing */
    [class*="shadow-"] {
      box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.06) !important;
    }
    .shadow-none {
      box-shadow: none !important;
    }

    /* Scrollbars phẳng tinh tế */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    /* NÚT BẤM CHÍNH: Màu xanh dương phẳng, chuẩn công nghệ giáo dục, không ombre */
    button[class*="from-"],
    button[class*="bg-indigo"],
    button[class*="bg-purple"],
    a[class*="from-"],
    a[class*="bg-indigo"],
    .btn-solid-primary {
      background-color: #2563eb !important;
      color: #ffffff !important;
      border: 1px solid #1d4ed8 !important;
    }
    button[class*="from-"]:hover,
    button[class*="bg-indigo"]:hover,
    button[class*="bg-purple"]:hover,
    a[class*="from-"]:hover,
    a[class*="bg-indigo"]:hover,
    .btn-solid-primary:hover {
      background-color: #1d4ed8 !important;
      color: #ffffff !important;
    }

    /* ============================================================
       2. GIAO DIỆN SÁNG (LIGHT THEME) - PHONG CÁCH TỐI GIẢN COURSERA / GITHUB
       ============================================================ */
    html.theme-light body,
    body.theme-light {
      background-color: #f8fafc !important;
      color: #1e293b !important;
    }

    .theme-light .flex.h-screen {
      background-color: #f8fafc !important;
    }

    /* Sidebar & Navigation */
    .theme-light aside {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
    }
    .theme-light aside h1 {
      color: #0f172a !important;
    }
    .theme-light aside nav button,
    .theme-light aside nav a {
      color: #475569 !important;
    }
    .theme-light aside nav button:hover,
    .theme-light aside nav a:hover {
      background-color: #f1f5f9 !important;
      color: #0f172a !important;
    }
    .theme-light aside button[class*="from-"],
    .theme-light aside button[class*="bg-gradient-to"],
    .theme-light aside button[class*="bg-indigo"],
    .theme-light aside button[class*="bg-emerald"] {
      background-color: #2563eb !important;
      color: #ffffff !important;
      border-color: #2563eb !important;
    }
    .theme-light aside button[class*="from-"] *,
    .theme-light aside button[class*="bg-gradient-to"] *,
    .theme-light aside button[class*="bg-indigo"] * {
      color: #ffffff !important;
    }

    /* Header */
    .theme-light header {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
    }

    /* Thẻ nội dung chính (Cards) */
    .theme-light .bg-slate-900,
    .theme-light [class*="bg-slate-900"],
    .theme-light [class*="from-indigo-950"],
    .theme-light [class*="from-emerald-950"],
    .theme-light [class*="from-slate-900"] {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
    }

    /* Thẻ con / Input / Bề mặt phụ (Subcards & Controls) */
    .theme-light .bg-slate-950,
    .theme-light [class*="bg-slate-950"],
    .theme-light .bg-slate-800,
    .theme-light [class*="bg-slate-800"] {
      background-color: #f8fafc !important;
      border-color: #e2e8f0 !important;
      color: #1e293b !important;
    }

    /* Đường viền */
    .theme-light [class*="border-slate-800"],
    .theme-light [class*="border-slate-700"],
    .theme-light [class*="border-indigo-500"],
    .theme-light [class*="border-emerald-500"],
    .theme-light [class*="divide-slate-800"] {
      border-color: #e2e8f0 !important;
    }

    /* Chữ hiển thị trên nền sáng */
    .theme-light h1, .theme-light h2, .theme-light h3, .theme-light h4, .theme-light h5, .theme-light h6 {
      color: #0f172a !important;
    }
    .theme-light p {
      color: #334155 !important;
    }
    .theme-light span.text-white:not(button *):not(a *),
    .theme-light div.text-white:not(button *):not(a *) {
      color: #0f172a !important;
    }
    .theme-light .text-slate-400,
    .theme-light .text-slate-500 {
      color: #64748b !important;
    }
    .theme-light .text-slate-300,
    .theme-light .text-slate-200 {
      color: #334155 !important;
    }

    /* Màu điểm nhấn: Đổi tím AI sang xanh dương công nghệ tiêu chuẩn */
    .theme-light .text-indigo-400,
    .theme-light .text-indigo-300,
    .theme-light .text-violet-400 {
      color: #2563eb !important;
    }
    .theme-light .text-emerald-400 {
      color: #16a34a !important;
    }
    .theme-light .text-amber-400,
    .theme-light .text-amber-300 {
      color: #d97706 !important;
    }
    .theme-light .text-rose-400 {
      color: #dc2626 !important;
    }

    /* Huy hiệu nhãn (Badges) */
    .theme-light [class*="bg-indigo-500/20"],
    .theme-light [class*="bg-indigo-500/10"],
    .theme-light [class*="bg-violet-500/20"] {
      background-color: #eff6ff !important;
      color: #1d4ed8 !important;
      border-color: #bfdbfe !important;
    }
    .theme-light [class*="bg-emerald-500/20"],
    .theme-light [class*="bg-emerald-500/10"] {
      background-color: #f0fdf4 !important;
      color: #15803d !important;
      border-color: #bbf7d0 !important;
    }
    .theme-light [class*="bg-amber-500/20"],
    .theme-light [class*="bg-amber-500/10"] {
      background-color: #fffbeb !important;
      color: #b45309 !important;
      border-color: #fde68a !important;
    }

    /* Form Controls */
    .theme-light input,
    .theme-light select,
    .theme-light textarea {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
    }
    .theme-light input:focus,
    .theme-light select:focus,
    .theme-light textarea:focus {
      border-color: #2563eb !important;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15) !important;
    }

    /* Nút bấm phụ */
    .theme-light button.bg-slate-800,
    .theme-light a.bg-slate-800 {
      background-color: #f1f5f9 !important;
      color: #334155 !important;
      border-color: #cbd5e1 !important;
    }
    .theme-light button.bg-slate-800:hover,
    .theme-light a.bg-slate-800:hover {
      background-color: #e2e8f0 !important;
      color: #0f172a !important;
    }

    /* Modal Backdrop */
    .theme-light .fixed.inset-0[class*="bg-slate-950"] {
      background-color: rgba(15, 23, 42, 0.45) !important;
    }
    .theme-light .fixed .bg-slate-900 {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
    }
    .theme-light .fixed .bg-slate-950 {
      background-color: #f8fafc !important;
      border-color: #e2e8f0 !important;
    }

    /* ============================================================
       3. GIAO DIỆN TỐI (DARK THEME) - PHẲNG, TINH TẾ, KHÔNG OMBRE
       ============================================================ */
    .dark .bg-slate-900,
    .dark [class*="from-indigo-950"],
    .dark [class*="from-emerald-950"],
    .dark [class*="from-slate-900"] {
      background-color: #0f172a !important;
      border-color: #1e293b !important;
    }
    .dark .bg-slate-950,
    .dark [class*="bg-slate-950"] {
      background-color: #020617 !important;
      border-color: #1e293b !important;
    }
    .dark .text-indigo-400,
    .dark .text-indigo-300 {
      color: #60a5fa !important;
    }
    .dark button[class*="from-"],
    .dark button[class*="bg-indigo"],
    .dark button[class*="bg-purple"],
    .dark aside button[class*="from-"] {
      background-color: #2563eb !important;
      color: #ffffff !important;
      border-color: #1d4ed8 !important;
    }

    /* Code blocks */
    pre, code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">

  <div id="root">
    <div
      style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: #f8fafc; color: #1e3a8a; font-family: system-ui, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #1e3a8a;">📘 Aegis Learn - Hệ Thống Học Tập</div>
        <div style="font-size: 14px; color: #64748b; font-weight: 500;">Đang tải dữ liệu học tập... Vui lòng chờ giây lát</div>
      </div>
    </div>
  </div>


  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE_URL = "/api/v1";

    // ============================================================
    // 1. QUIZ RESULT MODAL (MÀN HÌNH KẾT QUẢ TỨC THÌ)
    // ============================================================
    function QuizResultModal({ result, onReviewDetails, onRetake, onClose }) {
      if (!result) return null;
      const scorePercentage = result.score || 0;
      const passed = result.passed ?? (scorePercentage >= 60);

      const formatDuration = (seconds) => {
        if (!seconds) return "0 phút 0s";
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m} phút ${s}s`;
      };

      return (
        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl space-y-6 text-center animate-in fade-in zoom-in duration-200">
            <div className="space-y-2">
              <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800 text-3xl">
                {passed ? "🎉" : "💪"}
              </div>
              <h2 className="text-xl sm:text-2xl font-extrabold text-white tracking-tight">
                {passed ? "Chúc mừng! Bạn đã hoàn thành bài thi" : "Kết quả Bài kiểm tra"}
              </h2>
              <p className="text-xs text-slate-400 font-medium">
                {result.quiz_title || "Bài kiểm tra Đánh giá Kiến thức"}
              </p>
            </div>

            <div className={`p-6 rounded-2xl border ${passed ? 'bg-emerald-950/30 border-emerald-500/30 text-emerald-400' : 'bg-rose-950/30 border-rose-500/30 text-rose-400'} space-y-2`}>
              <div className="text-4xl sm:text-5xl font-black tracking-tight">{scorePercentage}%</div>
              <div className="flex items-center justify-center gap-2">
                <span className={`px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${passed ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-rose-500/20 text-rose-300 border border-rose-500/40'}`}>
                  {passed ? "✓ ĐẠT (PASSED)" : "✗ CẦN CẢI THIỆN (FAILED)"}
                </span>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3 text-left">
              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-1">
                <span className="text-[11px] text-slate-400 font-semibold block">Số câu trả lời đúng</span>
                <div className="text-lg font-bold text-white flex items-center gap-1.5">
                  <span className="text-blue-500 font-extrabold">{result.correct_count}</span>
                  <span className="text-slate-500 text-xs">/ {result.total_questions} câu</span>
                </div>
              </div>

              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-1">
                <span className="text-[11px] text-slate-400 font-semibold block">Thời gian làm bài</span>
                <div className="text-sm font-bold text-slate-200">{formatDuration(result.duration_seconds)}</div>
              </div>
            </div>

            <div className="space-y-3 pt-2">
              <button
                onClick={onReviewDetails}
                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-5 rounded-xl transition text-xs sm:text-sm flex items-center justify-center gap-2 transform active:scale-95"
              >
                <span>🔍 Xem chi tiết đáp án & Lời giải</span>
                <span>→</span>
              </button>

              <div className="flex gap-3">
                <button onClick={onRetake} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-4 rounded-2xl transition text-xs border border-slate-700 active:scale-95">
                  🔄 Làm lại bài thi
                </button>
                <button onClick={onClose} className="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 font-semibold px-5 py-3 rounded-2xl transition text-xs border border-slate-700">
                  Đóng
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // 2. QUIZ REVIEW SCREEN (CHẾ ĐỘ XEM CHI TIẾT ĐÁP ÁN & LỜI GIẢI)
    // ============================================================
    function QuizReviewScreen({ attemptDetail, onClose, onRetake }) {
      if (!attemptDetail) return null;
      const { quiz_title, score, passed, correct_count, total_questions, duration_seconds, created_at, review_questions = [] } = attemptDetail;

      const formatDuration = (seconds) => {
        if (!seconds) return "0m 0s";
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}m ${s}s`;
      };

      return (
        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-4xl w-full shadow-2xl space-y-6 my-auto max-h-[92vh] flex flex-col overflow-hidden">
            <div className="bg-slate-950/90 px-6 py-4 border-b border-slate-800 flex justify-between items-center shrink-0">
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold font-mono text-indigo-400 bg-indigo-500/10 px-2.5 py-0.5 rounded border border-indigo-500/20">LẦN THI CHUẨN ĐOÁN</span>
                  <span className="text-xs text-slate-400">{created_at}</span>
                </div>
                <h2 className="text-lg sm:text-xl font-bold text-white mt-1">🔍 Lời Giải Chi Tiết: {quiz_title || "Bài kiểm tra"}</h2>
              </div>
              <button onClick={onClose} className="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition font-bold">✕</button>
            </div>

            <div className="px-6 shrink-0">
              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-wrap justify-between items-center gap-4 text-xs">
                <div className="flex items-center gap-3">
                  <span className={`text-2xl font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}`}>{score}%</span>
                  <span className={`px-3 py-1 rounded-xl text-[11px] font-bold ${passed ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-300 border border-rose-500/20'}`}>
                    {passed ? "✓ ĐẠT" : "✗ CẦN CẢI THIỆN"}
                  </span>
                </div>
                <div className="flex items-center gap-6 text-slate-300">
                  <div><span className="text-slate-400 block text-[10px] uppercase font-semibold">Kết quả</span><span className="font-bold text-white">{correct_count} / {total_questions} câu đúng</span></div>
                  <div><span className="text-slate-400 block text-[10px] uppercase font-semibold">Thời gian</span><span className="font-bold text-white">{formatDuration(duration_seconds)}</span></div>
                </div>
              </div>
            </div>

            <div className="px-6 overflow-y-auto space-y-6 flex-1 pr-3">
              {review_questions.map((q, idx) => {
                const isUserCorrect = q.is_correct;
                const optionsObj = q.options || {};
                const optionKeys = Object.keys(optionsObj);

                return (
                  <div key={q.question_id || idx} className={`p-5 rounded-2xl border transition ${isUserCorrect ? 'bg-slate-950/70 border-emerald-500/30' : 'bg-slate-950/70 border-rose-500/30'} space-y-4`}>
                    <div className="flex justify-between items-start gap-3 border-b border-slate-800/80 pb-3">
                      <div className="flex items-center gap-2">
                        <span className="w-7 h-7 rounded-xl bg-slate-800 text-indigo-400 font-bold font-mono text-xs flex items-center justify-center border border-slate-700">{idx + 1}</span>
                        <span className="text-xs font-semibold text-slate-400">Câu hỏi {idx + 1} / {total_questions}</span>
                      </div>
                      <span className={`px-3 py-1 rounded-xl text-xs font-bold ${isUserCorrect ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}`}>
                        {isUserCorrect ? "✓ Đúng (+10 điểm)" : "✗ Sai"}
                      </span>
                    </div>

                    <p className="text-sm sm:text-base font-bold text-white leading-relaxed">{q.question_text || q.content}</p>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5 pt-1">
                      {optionKeys.map((key) => {
                        const optionVal = optionsObj[key];
                        const isSelected = (q.selected_answer === key);
                        const isCorrectOption = (q.correct_answer === key);

                        let cardStyle = "bg-slate-900 border-slate-800 text-slate-300";
                        let badgeStyle = "bg-slate-800 text-slate-400";
                        let iconSymbol = null;

                        if (isCorrectOption) {
                          cardStyle = "bg-emerald-950/40 border-emerald-500 text-emerald-200 font-bold ring-1 ring-emerald-500/50 shadow-md shadow-emerald-500/10";
                          badgeStyle = "bg-emerald-500 text-slate-950 font-black";
                          iconSymbol = <span className="text-emerald-400 font-bold text-xs">✓ (Đáp án đúng)</span>;
                        } else if (isSelected && !isUserCorrect) {
                          cardStyle = "bg-rose-950/40 border-rose-500 text-rose-200 font-semibold ring-1 ring-rose-500/40";
                          badgeStyle = "bg-rose-500 text-white font-black";
                          iconSymbol = <span className="text-rose-400 font-bold text-xs">✗ (Bạn chọn sai)</span>;
                        }

                        return (
                          <div key={key} className={`p-3 rounded-xl border flex items-center justify-between gap-3 text-xs transition ${cardStyle}`}>
                            <div className="flex items-center gap-2.5">
                              <span className={`w-6 h-6 rounded-lg text-xs font-mono font-bold flex items-center justify-center shrink-0 ${badgeStyle}`}>{key}</span>
                              <span className="leading-snug">{optionVal}</span>
                            </div>
                            {iconSymbol && <div className="shrink-0">{iconSymbol}</div>}
                          </div>
                        );
                      })}
                    </div>

                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-1.5 text-xs text-slate-300 leading-relaxed shadow-inner">
                      <div className="flex items-center gap-1.5 text-amber-400 font-bold">
                        <span>💡 Lời giải & Giải thích chi tiết (Pedagogical Explanation):</span>
                      </div>
                      <p className="text-slate-200 pl-1 border-l-2 border-amber-500/60 font-medium">
                        {q.explanation || "Đáp án đúng được xác định dựa trên nguyên lý sư phạm & chuẩn dữ liệu Python AI."}
                      </p>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="bg-slate-950/90 px-6 py-4 border-t border-slate-800 flex justify-between items-center gap-4 shrink-0">
              <button onClick={onClose} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-5 py-2.5 rounded-xl transition text-xs border border-slate-700">← Quay lại</button>
              {onRetake && (

        solution_code: `class TreeNode:
    def __init__(self, val=0):
        self.val = val
        self.left = None
        self.right = None

def insert_bst(root, val):
    if not root:
        return TreeNode(val)
    if val < root.val:
        root.left = insert_bst(root.left, val)
    else:
        root.right = insert_bst(root.right, val)
    return root

def inorder_traversal(root):
    res = []
    def dfs(node):
        if not node: return
        dfs(node.left)
        res.append(node.val)
        dfs(node.right)
    dfs(root)
    return res`

          fetchTopicMaterials(firstTid);
          fetchFlashcards(firstTid);
          fetchCrammingCheatSheet(firstTid);
        }
      };

      const handleExecute3TierSearch = async (queryText = searchQuery, score = targetScore) => {
        setIsSearchLoading(true);
        try {
          const res = await fetch(`${API_BASE_URL}/subjects/search?q=${encodeURIComponent(queryText || "")}&target_score=${score}`);
          if (res.ok) {
            const data = await res.json();
            setSearchModalData(data);
            setIsSearchModalOpen(true);
          }
        } catch (e) {
          alert("Lỗi tìm kiếm môn học!");
        } finally {
          setIsSearchLoading(false);
        }
      };

      const handleApplySubjectFromSearch = (matchedSubject) => {
        if (!matchedSubject) return;
        setIsSearchModalOpen(false);
        handleSwitchSubject(matchedSubject.id);
        setActiveWorkspace("LEARNING_PATH");
      };

      // ============================================================
      // HANDLERS: QUIZZES & EXAMS
      // ============================================================
      const handleStartTopicDrill = async (topicId, diff = 3.0) => {
        const tid = topicId || selectedTopicId || 101;
        try {
          const res = await fetch(`${API_BASE_URL}/question-bank/practice?topic_id=${tid}&count=15&difficulty_level=${diff}`);
          if (res.ok) {
            const data = await res.json();
            startQuizSession({
              ...data,
              title: `Topic Drill: ${activeSubject?.title || 'Luyện tập'} (15 câu)`,
              time_limit_minutes: 20
            });
          }
        } catch (e) {
          alert("Lỗi tải đề Topic Drill!");
        }
      };

      const handleStartMockExam = async () => {
        try {
          const res = await fetch(`${API_BASE_URL}/question-bank/random?count=25`);
          if (res.ok) {
            const data = await res.json();
            startQuizSession({
              ...data,
              title: `Đề Thi Thử Chuẩn Hóa Phòng Thi Thật (Mock Exam Simulator) - Môn ${activeSubject?.title || 'AI'}`,
              time_limit_minutes: 50,
              is_mock_exam: true
            });
          }
        } catch (e) {
          alert("Lỗi tải Đề thi thử mô phỏng!");
        }
      };

      const handleStartErrorClearance = async () => {
        try {
          const res = await fetch(`${API_BASE_URL}/quiz/error-clearance/generate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: 1 })
          });
          if (res.ok) {
            const data = await res.json();
            startQuizSession(data);
          }
        } catch (e) {
          alert("Lỗi sinh đề phục thù xoá lỗi sai!");
        }
      };

      const startQuizSession = (quizData) => {
        setActiveQuiz(quizData);
        setQuizAnswers({});
        setQuizTimer((quizData.time_limit_minutes || 20) * 60);
        setQuizResult(null);
      };

      const handleSubmitQuiz = async () => {
        if (!activeQuiz) return;
        const answersList = Object.keys(quizAnswers).map(qid => ({
          question_id: parseInt(qid),
          selected_answer: quizAnswers[qid]
        }));
        const durationSecs = ((activeQuiz.time_limit_minutes || 20) * 60) - quizTimer;

        try {
          const res = await fetch(`${API_BASE_URL}/quiz/submit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              user_id: 1,
              quiz_id: activeQuiz.id || 201,
              quiz_title: activeQuiz.title || "Bài kiểm tra Đánh giá Năng lực",
              answers: answersList,
              duration_seconds: durationSecs > 0 ? durationSecs : 180
            })
          });

          let resultData = null;
          if (res.ok) {
            resultData = await res.json();
          } else {
            // Fallback scoring
            let correct = 0;
            const reviewQs = (activeQuiz.questions || []).map(q => {
              const sel = quizAnswers[q.id] || "Chưa chọn";
              const isCorr = (sel.toUpperCase() === (q.correct_answer || "A").toUpperCase());
              if (isCorr) correct++;
              return {
                question_id: q.id,
                question_text: q.content,
                options: q.options || {},
                selected_answer: sel,
                correct_answer: q.correct_answer || "A",
                is_correct: isCorr,
                explanation: q.explanation || "Giải thích đáp án chi tiết."
              };
            });
            const sc = Math.round((correct / (activeQuiz.questions?.length || 1)) * 100);
            resultData = {
              attempt_id: Date.now(),
              quiz_id: activeQuiz.id || 201,
              quiz_title: activeQuiz.title || "Bài kiểm tra",
              score: sc,
              total_questions: activeQuiz.questions?.length || 1,
              correct_count: correct,
              passed: sc >= 60,
              duration_seconds: durationSecs,
              created_at: "Vừa xong",
              review_questions: reviewQs
            };
          }

          setActiveQuiz(null);
          setInstantResultModal(resultData);
          fetchScorePrediction();
          fetchErrorVault();
          fetchQuizHistory();

          if (resultData && resultData.score >= 70 && selectedTopicId) {
            setMasteredTopicIds(prev => Array.from(new Set([...prev, selectedTopicId])));
            fetchLearningPath(activeSubject, selectedTopicId);
          }
        } catch (e) {
          alert("Lỗi nộp bài thi!");
        }
      };

      // ============================================================
      // HANDLERS: AI TUTOR WITH GOOGLE GROUNDING
      // ============================================================
      const handleSendAiChatMessage = async (customMsg = null) => {
        const text = (customMsg || chatInput).trim();
        if (!text || isAiThinking) return;

        const userMsg = { id: Date.now(), role: "user", content: text };
        setChatMessages(prev => [...prev, userMsg]);
        setChatInput("");
        setIsAiThinking(true);

        try {
          const res = await fetch(`${API_BASE_URL}/ai/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              user_id: 1,
              topic_id: selectedTopicId || 101,
              message: text,
              history: chatMessages.slice(-6).map(m => ({ role: m.role, content: m.content }))
            })
          });

          if (res.ok) {
            const data = await res.json();
            const aiMsg = {
              id: Date.now() + 1,
              role: "assistant",
              content: data.reply,
              suggested_followups: data.suggested_followups || [],
              model_used: data.model_used,
              sources: data.sources || []
            };
            setChatMessages(prev => [...prev, aiMsg]);
          }
        } catch (e) {
          console.warn("AI Chat error:", e);
        } finally {
          setIsAiThinking(false);
        }
      };

      // Evaluate Feynman Explanation
      const handleEvaluateFeynman = async () => {
        if (!feynmanText.trim()) {
          alert("Vui lòng nhập lời giải thích của bạn để AI đánh giá!");
          return;
        }
        setIsEvaluatingFeynman(true);
        try {
          const res = await fetch(`${API_BASE_URL}/learning/feynman/reflect`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              user_id: 1,
              topic_id: selectedTopicId || 101,
              concept_explained: feynmanConcept,
              student_explanation: feynmanText
            })
          });
          if (res.ok) {
            const data = await res.json();
            setFeynmanEvaluation(data);
          }
        } catch (e) {
          alert("Lỗi chấm điểm phòng Feynman!");
        } finally {
          setIsEvaluatingFeynman(false);
        }
      };

      // Format Markdown Helper
      const renderFormattedAiContent = (text) => {
        if (!text) return null;
        const parts = text.split(/(```[\s\S]*?```)/g);
        return parts.map((part, index) => {
          if (part.startsWith('```') && part.endsWith('```')) {
            const lines = part.slice(3, -3).trim().split('\n');
            const lang = lines[0].trim();
            const code = (lang && !lang.includes(' ') && lines.length > 1) ? lines.slice(1).join('\n') : lines.join('\n');
            return (
              <div key={index} className="my-3 rounded-xl overflow-hidden border border-slate-800 bg-slate-950 shadow-md">
                <div className="bg-slate-900/90 px-3.5 py-1.5 flex justify-between items-center text-[11px] text-slate-400 border-b border-slate-800">
                  <span className="font-mono text-indigo-400 font-semibold">{lang || 'python'}</span>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(code);
                      setCopiedCodeId(index);
                      setTimeout(() => setCopiedCodeId(null), 2000);
                    }}
                    className="hover:text-white transition flex items-center gap-1 font-medium text-[11px]"
                  >
                    {copiedCodeId === index ? "✓ Đã chép" : "📋 Sao chép code"}
                  </button>
                </div>
                <pre className="p-3.5 text-xs text-emerald-300 font-mono overflow-x-auto leading-relaxed">
                  <code>{code}</code>
                </pre>
              </div>
            );
          }

          const lines = part.split('\n');
          return (
            <div key={index} className="space-y-1.5">
              {lines.map((line, lIdx) => {
                if (line.startsWith('### ')) {
                  return <h4 key={lIdx} className="text-base font-bold text-white mt-3 mb-1.5 flex items-center gap-1.5">{line.replace('### ', '')}</h4>;
                }
                if (line.startsWith('#### ')) {
                  return <h5 key={lIdx} className="text-sm font-bold text-indigo-300 mt-2 mb-1">{line.replace('#### ', '')}</h5>;
                }
                if (line.startsWith('- ') || line.startsWith('* ')) {
                  return (
                    <div key={lIdx} className="flex items-start gap-2 ml-2 text-xs text-slate-300 leading-relaxed">
                      <span className="text-indigo-400 mt-0.5">•</span>
                      <span>{line.substring(2)}</span>
                    </div>
                  );
                }
                if (!line.trim()) return <div key={lIdx} className="h-1" />;
                return <p key={lIdx} className="text-xs text-slate-300 leading-relaxed">{line}</p>;
              })}
            </div>
          );
        });
      };

      // ============================================================
      // RENDER MAIN APPLICATION
      // ============================================================
      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden font-sans">

          {/* ======================================================= */}
          {/* SIDEBAR NAVIGATION (5 DEDICATED WORKSPACES) */}
          {/* ======================================================= */}
          <aside className="w-64 bg-slate-900/90 border-r border-slate-800 flex flex-col justify-between p-4 backdrop-blur-lg shrink-0 z-20">
            <div>
              {/* BRAND LOGO */}
              <div className="flex items-center gap-3 px-3 py-3 mb-6 bg-slate-950/40 rounded-2xl border border-slate-800/80">
                <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl">
                  📘
                </div>
                <div>
                  <h1 className="font-extrabold text-base text-white tracking-tight leading-tight">Aegis Learn</h1>
                  <span className="text-[11px] text-slate-400 font-medium">
                    Hệ Thống Học Tập
                  </span>
                </div>
              </div>

              {/* 5 WORKSPACE NAVIGATION BUTTONS */}
              <div className="space-y-1">
                <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider px-3 mb-1 block">Không gian học tập</span>

                {/* 1. COCKPIT */}
                <button
                  onClick={() => setActiveWorkspace("COCKPIT")}
                  className={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-semibold transition ${activeWorkspace === 'COCKPIT' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <div className="flex items-center gap-3">
                    <span className="text-base">📊</span>
                    <span>Bảng Điều Khiển Điểm Số</span>
                  </div>
                  {scorePrediction && (
                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${activeWorkspace === 'COCKPIT' ? 'bg-white/20 text-white' : 'bg-slate-800 text-slate-300'}`}>
                      {scorePrediction.current_predicted_score}đ
                    </span>
                  )}
                </button>

                {/* 2. LEARNING PATH DAG */}
                <button
                  onClick={() => setActiveWorkspace("LEARNING_PATH")}
                  className={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-semibold transition ${activeWorkspace === 'LEARNING_PATH' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <div className="flex items-center gap-3">
                    <span className="text-base">🗺️</span>
                    <span>Lộ Trình Kiến Thức DAG</span>
                  </div>
                  <span className="text-[10px] text-slate-400 font-mono">
                    {learningPathData?.completed_steps_count || 0}/{learningPathData?.total_steps || 0}
                  </span>
                </button>

                {/* 3. PRACTICE & EXAMS (Thay Đấu Trường) */}
                <button
                  onClick={() => setActiveWorkspace("PRACTICE_AND_EXAMS")}
                  className={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-semibold transition ${activeWorkspace === 'PRACTICE_AND_EXAMS' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <div className="flex items-center gap-3">
                    <span className="text-base">💻</span>
                    <span>Bài Tập & Đề Thi</span>
                  </div>
                  <span className="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-slate-700">
                    Labs & Thi
                  </span>
                </button>

                {/* 4. CAREER ROADMAP & SKILL TREE (Thay Đồ Án CV) */}
                <button
                  onClick={() => setActiveWorkspace("CAREER_ROADMAP")}
                  className={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-semibold transition ${activeWorkspace === 'CAREER_ROADMAP' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <div className="flex items-center gap-3">
                    <span className="text-base">🌳</span>
                    <span>Cây Kỹ Năng Chuyên Ngành</span>
                  </div>
                  <span className="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-slate-700">
                    Roadmap
                  </span>
                </button>

                {/* 5. AI STUDY ROOM */}
                <button
                  onClick={() => setActiveWorkspace("AI_STUDY_ROOM")}
                  className={`w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-semibold transition ${activeWorkspace === 'AI_STUDY_ROOM' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`}
                >
                  <div className="flex items-center gap-3">
                    <span className="text-base">📚</span>
                    <span>Phòng Tự Học & Tra Cứu</span>
                  </div>
                  <span className="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-slate-700">
                    Tài liệu
                  </span>
                </button>
              </div>

              {/* EXTERNAL SHORTCUTS */}
              <div className="mt-6 pt-4 border-t border-slate-800 space-y-1">
                <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider px-3 mb-1 block">Hệ thống</span>
                <a href="/admin" className="flex items-center gap-3 px-3.5 py-2 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition">
                  <span>🛡️</span> Quản trị viên (Admin)
                </a>
                <a href="/docs" target="_blank" className="flex items-center gap-3 px-3.5 py-2 rounded-xl text-xs font-medium text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 transition">
                  <span>⚡</span> Swagger API Docs
                </a>
              </div>
            </div>

            {/* GAMIFICATION & USER PROFILE */}
            <div className="pt-4 border-t border-slate-800 space-y-3">
              <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800 text-xs flex justify-between items-center shadow-inner">
                <span className="flex items-center gap-1.5 text-amber-400 font-bold">
                  🔥 Streak: {userProfile.streak_days} Ngày
                </span>
                <span className="text-indigo-400 font-extrabold">⭐ {userProfile.exp_points} XP</span>
              </div>

              <div className="flex items-center gap-3 p-2.5 rounded-2xl bg-slate-800/40 border border-slate-800">
                <div className="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                  SV
                </div>
                <div className="flex-1 min-w-0">
                  <p className="text-xs font-bold text-white truncate">{userProfile.full_name}</p>
                  <p className="text-[10px] text-slate-400 truncate">Hệ thống Đào tạo & Khảo thí</p>
                </div>
              </div>
            </div>
          </aside>

          {/* ======================================================= */}
          {/* MAIN WORKSPACE CONTAINER */}
          {/* ======================================================= */}
          <main className="flex-1 flex flex-col overflow-y-auto min-w-0">

            {/* GLOBAL TOPBAR: MULTI-SUBJECT SELECTOR & 3-TIER SEARCH */}
            <header className="h-16 border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-xl px-6 flex items-center justify-between sticky top-0 z-30 shrink-0">
              {/* SEARCH BAR & TARGET SCORE */}
              <div className="flex items-center gap-3 flex-1 max-w-2xl">
                <div className="relative flex-1 flex items-center">
                  <span className="absolute left-3.5 text-slate-400 text-sm">🔍</span>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') handleExecute3TierSearch(e.target.value, targetScore); }}
                    placeholder="Tìm kiếm môn học AI (Toán AI, Deep Learning, SQL, Python, Giải thuật...)"
                    className="w-full bg-slate-950/80 border border-slate-800 rounded-2xl pl-10 pr-28 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 shadow-inner"
                  />
                  <button
                    onClick={() => handleExecute3TierSearch(searchQuery, targetScore)}
                    disabled={isSearchLoading}
                    className="absolute right-1.5 bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-semibold px-3 py-1.5 rounded-xl transition flex items-center gap-1 shadow-sm"
                  >
                    {isSearchLoading ? "Đang tìm..." : "Tìm Kiếm 🔍"}
                  </button>
                </div>

                {/* TARGET SCORE SELECTOR */}
                <div className="hidden sm:flex items-center gap-1.5 bg-slate-950/80 border border-slate-800 rounded-2xl px-3 py-1.5 shrink-0">
                  <span className="text-[11px] font-bold text-amber-400">🎯 Mục tiêu:</span>
                  <select
                    value={targetScore}
                    onChange={(e) => setTargetScore(parseFloat(e.target.value))}
                    className="bg-transparent text-xs font-bold text-white outline-none cursor-pointer"
                  >
                    <option value={10.0} className="bg-slate-900">10.0 (Tuyệt đối)</option>
                    <option value={9.5} className="bg-slate-900">9.5 (A+ Thủ khoa)</option>
                    <option value={9.0} className="bg-slate-900">9.0 (A Xuất sắc)</option>
                    <option value={8.5} className="bg-slate-900">8.5 (A Giỏi)</option>
                    <option value={7.5} className="bg-slate-900">7.5 (B+ Khá)</option>
                  </select>
                </div>
              </div>

              {/* THEME TOGGLE */}
              <div className="flex items-center gap-3">
                <button
                  onClick={toggleTheme}
                  title="Chuyển đổi Chế độ Sáng dịu mắt / Tối"
                  className="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 px-3.5 py-1.5 rounded-2xl text-xs font-semibold transition flex items-center gap-1.5 shadow-sm"
                >
                  <span>{theme === 'light' ? '🌙' : '☀️'}</span>
                  <span className="hidden sm:inline">{theme === 'light' ? 'Tối' : 'Sáng'}</span>
                </button>
              </div>
            </header>

            {/* ======================================================= */}
            {/* WORKSPACE 1: 🎯 COCKPIT (BẢNG ĐIỀU KHIỂN ĐIỂM SỐ) */}
            {/* ======================================================= */}
            {activeWorkspace === "COCKPIT" && (
              <div className="p-6 lg:p-8 space-y-8 max-w-7xl mx-auto w-full">

                {/* HERO SCORE PREDICTOR CARD */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 lg:p-8 shadow-sm">
                  <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
                    <div>
                      <div className="flex items-center gap-2 mb-2 flex-wrap">
                        <span className="px-3 py-1 rounded-full text-xs font-bold bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20">
                          📊 ĐÁNH GIÁ NĂNG LỰC HỌC TẬP
                        </span>
                        <span className="text-xs text-slate-400 font-medium">
                          Môn: {activeSubject?.title || 'Khoa học Dữ liệu'}
                        </span>
                      </div>
                      <h2 className="text-2xl lg:text-3xl font-bold text-white tracking-tight">
                        Mục Tiêu Học Tập: Điểm {targetScore.toFixed(1)} ({scorePrediction?.target_grade || 'Xuất sắc'}) 🎯
                      </h2>
                      <p className="text-xs text-slate-400 mt-1 max-w-2xl leading-relaxed">
                        Hệ thống tổng hợp kết quả bài tập thực hành, bài kiểm tra và mức độ hoàn thành kiến thức để theo dõi sát sao tiến độ học tập của bạn.
                      </p>
                    </div>

                    {/* SCORE COMPARISON BOX */}
                    <div className="flex items-center gap-4 bg-slate-950 border border-slate-800 rounded-2xl p-4 shadow-sm">
                      <div className="text-center px-3">
                        <span className="text-[11px] text-slate-400 font-semibold block">Dự báo Hiện tại</span>
                        <div className="text-3xl font-black text-blue-500 dark:text-blue-400">
                          {scorePrediction?.current_predicted_score || 4.5}
                          <span className="text-xs text-slate-500">/10</span>
                        </div>
                        <span className="text-[10px] text-slate-400 font-bold block mt-0.5">
                          {scorePrediction?.grade_letter || 'Grade C'}
                        </span>
                      </div>

                      <div className="text-xl text-slate-600 font-light">➔</div>

                      <div className="text-center px-3 border-l border-slate-800">
                        <span className="text-[11px] text-slate-400 font-semibold block">Mục tiêu Đạt</span>
                        <div className="text-3xl font-black text-emerald-500">
                          {targetScore.toFixed(1)}
                          <span className="text-xs text-slate-500">/10</span>
                        </div>
                        <span className="text-[10px] text-emerald-600 dark:text-emerald-400 font-bold block mt-0.5">
                          {targetScore >= 9.0 ? 'Grade A (Xuất sắc)' : 'Grade B+ (Giỏi)'}
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* PROGRESS BAR & STATS */}

                        >
                          <div className="flex justify-between items-center text-xs text-slate-500">
                            <span className="font-mono font-bold text-indigo-400">{flashcardsList[cardIdx]?.topic_code}</span>
                            <span>{isCardFlipped ? "Mặt Sau (Lời Giải)" : "Mặt Trước (Câu Hỏi)"}</span>
                          </div>

                          <div className="my-auto py-4">
                            <p className="text-base sm:text-lg font-bold text-white leading-relaxed">
                              {isCardFlipped ? flashcardsList[cardIdx]?.back : flashcardsList[cardIdx]?.front}
                            </p>
                            {isCardFlipped && (
                              <p className="text-xs text-indigo-300 bg-indigo-950/60 p-3 rounded-xl border border-indigo-500/30 mt-4 text-left">
                                💡 <strong>Key Insight:</strong> {flashcardsList[cardIdx]?.key_insight}
                              </p>
                            )}
                          </div>

                          <span className="text-[11px] text-slate-500">
                            {isCardFlipped ? "Bấm lại để xem câu hỏi" : "Bấm vào thẻ để xem đáp án"}
                          </span>
                        </div>

                        {/* RATING BUTTONS */}
                        <div className="flex gap-3 justify-center">
                          <button
                            onClick={() => {
                              setIsCardFlipped(false);
                              setCardIdx((cardIdx + 1) % flashcardsList.length);
                            }}
                            className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs px-5 py-2.5 rounded-xl border border-slate-700 transition"
                          >
                            Đã nhớ tốt ✓ Tiếp theo →
                          </button>
                        </div>
                      </div>
                    ) : (
                      <p className="text-xs text-slate-400">Đang tải thẻ ghi nhớ Flashcard...</p>
                    )}
                  </div>
                )}

              </div>
            )}

          </main>

          {/* ======================================================= */}
          {/* MODAL 1: 3-TIER RECOMMENDATION PRESENTATION MODAL */}
          {/* ======================================================= */}
          {isSearchModalOpen && searchModalData && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-indigo-500/40 rounded-3xl max-w-4xl w-full shadow-2xl p-6 lg:p-8 space-y-6 my-auto max-h-[92vh] flex flex-col overflow-hidden">

                {/* MODAL HEADER */}
                <div className="border-b border-slate-800 pb-4 flex justify-between items-start">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-xs font-mono font-bold px-2.5 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                        {searchModalData.matched_subject.code}
                      </span>
                      <span className="text-xs font-bold text-amber-400 bg-amber-500/10 px-2.5 py-0.5 rounded-full border border-amber-500/20">
                        🎯 Mục tiêu: {searchModalData.target_score} Điểm ({searchModalData.tier3_score_strategy.grade_letter})
                      </span>
                    </div>
                    <h3 className="text-xl lg:text-2xl font-black text-white">
                      {searchModalData.matched_subject.title}
                    </h3>
                    <p className="text-xs text-slate-400 mt-1 max-w-2xl">
                      {searchModalData.matched_subject.description}
                    </p>
                  </div>
                  <button
                    onClick={() => setIsSearchModalOpen(false)}
                    className="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* MODAL SCROLLABLE CONTENT */}
                <div className="overflow-y-auto space-y-6 pr-1">

                  {/* PHẦN GỢI Ý CÁC MÔN HỌC LIÊN QUAN (ĐA MÔN ĐỀ XUẤT) */}
                  {searchModalData.related_subjects && searchModalData.related_subjects.length > 0 && (
                    <div className="space-y-3 bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-sm">
                      <div className="flex items-center justify-between flex-wrap gap-2">
                        <div>
                          <span className="text-[10px] font-bold uppercase tracking-wider text-amber-400 bg-amber-500/10 px-2.5 py-0.5 rounded-full border border-amber-500/20">
                            🎯 Đề Xuất Chuyên Ngành Liên Quan
                          </span>
                          <h4 className="text-sm lg:text-base font-bold text-white mt-1 flex items-center gap-2">
                            <span>Gợi ý {searchModalData.related_subjects.length} môn học phù hợp từ khóa &quot;{searchModalData.query || 'AI & Data'}&quot;:</span>
                          </h4>
                        </div>
                        <span className="text-xs text-blue-400 font-medium">Bấm chọn môn bên dưới để học và lưu tiến độ</span>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pt-1">
                        {searchModalData.related_subjects.map((rel) => {
                          const isCurrent = activeSubject?.id === rel.id;
                          const icon = rel.code.includes('DATA_SCIENCE') ? '📊' : rel.code.includes('DATA_ENG') ? '⚙️' : rel.code.includes('DATA_VIZ') ? '📈' : rel.code.includes('SQL') ? '💾' : rel.code.includes('DSA') ? '🌳' : rel.code.includes('PYTHON') ? '🐍' : rel.code.includes('MACHINE') ? '🤖' : rel.code.includes('DEEP') ? '🧠' : rel.code.includes('NLP') ? '💬' : rel.code.includes('VISION') ? '👁️' : rel.code.includes('MATH') ? '📐' : '📘';
                          return (
                            <div
                              key={rel.id}
                              className={`p-4 rounded-xl border flex flex-col justify-between transition shadow-sm ${
                                isCurrent
                                  ? 'bg-blue-950/40 border-blue-600'
                                  : 'bg-slate-950 border-slate-800 hover:border-slate-700'
                              }`}
                            >
                              <div className="space-y-1.5">
                                <div className="flex justify-between items-center text-[10px]">
                                  <span className="font-mono font-bold px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20">
                                    {icon} {rel.code}
                                  </span>
                                  <span className="text-slate-400 font-mono font-semibold">{rel.topics_count} chương học</span>
                                </div>
                                <h5 className="font-bold text-white text-xs leading-snug line-clamp-1">{rel.title}</h5>
                                <p className="text-[11px] text-slate-400 line-clamp-2">{rel.description}</p>
                                <div className="text-[10px] text-amber-300 font-semibold bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20 line-clamp-1">
                                  ⚡ {rel.relevance_reason}
                                </div>
                              </div>

                              <button
                                onClick={() => handleApplySubjectFromSearch(rel)}
                                className={`mt-3 w-full font-bold text-xs py-2 rounded-lg transition shadow-sm flex items-center justify-center gap-1.5 ${
                                  isCurrent
                                    ? 'bg-emerald-600 hover:bg-emerald-700 text-white'
                                    : 'bg-blue-600 hover:bg-blue-700 text-white'
                                }`}
                              >
                                <span>{isCurrent ? '✓ Đang Theo Học (Mở Lại)' : '🚀 Chọn Học Môn Này Ngay →'}</span>
                              </button>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* TẦNG 1: TÀI LIỆU WEB & OFFICIAL DOCS CHỌN LỌC */}
                  <div className="space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="w-6 h-6 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xs font-bold">1</span>
                      <h4 className="text-sm font-extrabold text-white uppercase tracking-wider flex items-center gap-1.5">
                        <span>🌐 TẦNG 1: TÀI LIỆU WEB & OFFICIAL DOCS CHÍNH THỐNG</span>
                        <span className="text-[10px] text-indigo-400 font-semibold normal-case">(Tự học & Tra cứu sâu)</span>
                      </h4>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {(searchModalData.tier1_web_resources || []).map((web, wIdx) => (
                        <div key={wIdx} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 hover:border-indigo-500/40 transition flex flex-col justify-between space-y-2">
                          <div className="space-y-1">
                            <div className="flex justify-between items-center text-[10px]">
                              <span className="font-bold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded">
                                {web.institution}
                              </span>
                              <span className="text-slate-500 font-mono">Độ khó: {web.difficulty_level}/5</span>
                            </div>
                            <h5 className="font-bold text-white text-xs leading-snug">{web.title}</h5>
                            <p className="text-[11px] text-slate-400 line-clamp-2">{web.description}</p>
                          </div>

                          <div className="pt-2 border-t border-slate-800/80">
                            <a
                              href={web.url}
                              target="_blank"
                              rel="noreferrer"
                              className="text-xs text-indigo-400 hover:text-indigo-300 font-bold inline-flex items-center gap-1"
                            >
                              <span>Mở tài liệu đọc ↗</span>
                            </a>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* TẦNG 2: VIDEO BÀI GIẢNG YOUTUBE CHẤT LƯỢNG CAO */}
                  <div className="space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="w-6 h-6 rounded-lg bg-rose-500/20 text-rose-400 flex items-center justify-center text-xs font-bold">2</span>
                      <h4 className="text-sm font-extrabold text-white uppercase tracking-wider flex items-center gap-1.5">
                        <span>📺 TẦNG 2: VIDEO BÀI GIẢNG YOUTUBE CHỌN LỌC</span>
                        <span className="text-[10px] text-rose-400 font-semibold normal-case">(Trực quan hóa bản chất)</span>
                      </h4>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      {(searchModalData.tier2_youtube_videos || []).map((yt, yIdx) => (
                        <div key={yIdx} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 hover:border-rose-500/40 transition flex flex-col justify-between space-y-2">
                          <div className="space-y-1">
                            <div className="flex justify-between items-center text-[10px]">
                              <span className="font-bold text-rose-400 bg-rose-500/10 px-2 py-0.5 rounded">
                                📺 {yt.channel}
                              </span>
                              <span className="text-slate-500 font-mono">⏱️ ~{yt.duration_minutes} phút</span>
                            </div>
                            <h5 className="font-bold text-white text-xs leading-snug">{yt.title}</h5>
                            <p className="text-[11px] text-slate-400 line-clamp-2">{yt.description}</p>
                          </div>

                          <div className="pt-2 border-t border-slate-800/80">
                            <a
                              href={yt.url}
                              target="_blank"
                              rel="noreferrer"
                              className="text-xs text-rose-400 hover:text-rose-300 font-bold inline-flex items-center gap-1"
                            >
                              <span>Xem video bài giảng ↗</span>
                            </a>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* TẦNG 3: BỘ CÔNG CỤ CHINH PHỤC ĐIỂM SỐ CỦA AEGIS LEARN */}
                  <div className="space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="w-6 h-6 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-bold">3</span>
                      <h4 className="text-sm font-extrabold text-white uppercase tracking-wider flex items-center gap-1.5">
                        <span>🏆 TẦNG 3: BỘ CÔNG CỤ CHINH PHỤC ĐIỂM SỐ CỦA AEGIS LEARN</span>
                        <span className="text-[10px] text-emerald-400 font-semibold normal-case">(Tối ưu hóa điểm thi)</span>
                      </h4>
                    </div>

                    <div className="bg-slate-950 p-5 rounded-2xl border border-indigo-500/30 space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                        <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                          <span className="text-slate-400 block">Thời gian học ước tính</span>
                          <span className="text-base font-bold text-indigo-400">⏱️ {searchModalData.tier3_score_strategy.estimated_study_hours} giờ</span>
                        </div>
                        <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                          <span className="text-slate-400 block">Cam kết mỗi ngày</span>
                          <span className="text-base font-bold text-amber-400">📅 {searchModalData.tier3_score_strategy.daily_commitment_minutes} phút/ngày</span>
                        </div>
                        <div className="bg-slate-900 p-3 rounded-xl border border-slate-800">
                          <span className="text-slate-400 block">Tiêu chuẩn đầu ra</span>
                          <span className="text-base font-bold text-emerald-400">{searchModalData.tier3_score_strategy.grade_letter}</span>
                        </div>
                      </div>

                      {/* ACTION PLAN */}
                      <div className="space-y-2">
                        <span className="text-xs font-bold text-slate-300 block">Kế hoạch 5 bước độc quyền từ Aegis Learn:</span>
                        {(searchModalData.tier3_score_strategy.action_plan || []).map((act, aIdx) => (
                          <div key={aIdx} className="text-xs text-slate-300 flex items-start gap-2 bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                            <span className="text-emerald-400 font-bold">✓</span>
                            <span>{act}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                </div>

                {/* MODAL FOOTER */}
                <div className="pt-4 border-t border-slate-800 flex flex-col sm:flex-row gap-3">
                  <button
                    onClick={() => handleApplySubjectFromSearch(searchModalData.matched_subject)}
                    className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm py-3 px-6 rounded-xl transition shadow-sm flex items-center justify-center gap-2"
                  >
                    <span>🚀 Bắt Đầu Học Môn Này Ngay ({searchModalData.matched_subject.title})</span>
                    <span>→</span>
                  </button>
                  <button
                    onClick={() => setIsSearchModalOpen(false)}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs px-5 py-3 rounded-xl transition border border-slate-700"
                  >
                    Đóng
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* ======================================================= */}
          {/* MODAL 2: QUIZ PLAYER MODAL */}
          {/* ======================================================= */}
          {activeQuiz && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-3xl w-full shadow-2xl p-6 lg:p-8 space-y-6 my-auto max-h-[95vh] flex flex-col overflow-hidden">
                <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                  <div>
                    <h3 className="text-base font-bold text-white">{activeQuiz.title}</h3>
                    <span className="text-xs text-indigo-400">
                      Đã chọn {Object.keys(quizAnswers).length} / {activeQuiz.questions?.length || 0} câu
                    </span>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="text-sm font-mono font-bold text-amber-400 bg-amber-500/10 px-3 py-1 rounded-xl border border-amber-500/20">
                      ⏱️ {formatPomodoro(quizTimer)}
                    </span>
                    <button onClick={() => setActiveQuiz(null)} className="text-slate-400 hover:text-white font-bold text-sm">✕</button>
                  </div>
                </div>

                {/* QUESTIONS */}
                <div className="overflow-y-auto space-y-6 pr-2">
                  {(activeQuiz.questions || []).map((q, idx) => (
                    <div key={q.id} className="bg-slate-950 p-5 rounded-2xl border border-slate-800 space-y-3">
                      <span className="text-xs font-bold text-indigo-400">Câu {idx + 1}:</span>
                      <h4 className="text-sm font-bold text-white leading-relaxed">{q.content}</h4>

                      <div className="space-y-2">
                        {Object.keys(q.options || {}).map(optKey => {
                          const isSelected = quizAnswers[q.id] === optKey;
                          return (
                            <button
                              key={optKey}
                              onClick={() => setQuizAnswers(prev => ({ ...prev, [q.id]: optKey }))}
                              className={`w-full text-left p-3.5 rounded-xl text-xs font-medium transition flex items-center gap-3 border ${isSelected ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800'}`}
                            >
                              <span className={`w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs shrink-0 ${isSelected ? 'bg-white text-blue-600' : 'bg-slate-800 text-slate-400'}`}>
                                {optKey}
                              </span>
                              <span className="flex-1">{q.options[optKey]}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>

                {/* FOOTER */}
                <div className="pt-4 border-t border-slate-800 flex justify-between items-center">
                  <span className="text-xs text-slate-400">
                    Hãy kiểm tra kỹ các câu hỏi trước khi nộp bài
                  </span>
                  <button
                    onClick={handleSubmitQuiz}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-6 py-3 rounded-xl transition shadow-lg shadow-emerald-600/30"
                  >
                    Nộp Bài Kiểm Tra ✓
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================= */}
          {/* MODAL 3: INSTANT RESULT MODAL */}
          {/* ======================================================= */}
          {instantResultModal && (
            <QuizResultModal
              result={instantResultModal}
              onReviewDetails={() => {
                setActiveReviewDetailModal(instantResultModal);
                setInstantResultModal(null);
              }}
              onRetake={() => {
                setInstantResultModal(null);
                handleStartTopicDrill(selectedTopicId, 3.0);
              }}
              onClose={() => setInstantResultModal(null)}
            />
          )}

          {/* ======================================================= */}
          {/* MODAL 4: DETAILED REVIEW SCREEN MODAL */}
          {/* ======================================================= */}
          {activeReviewDetailModal && (
            <QuizReviewScreen
              attemptDetail={activeReviewDetailModal}
              onClose={() => setActiveReviewDetailModal(null)}
              onRetake={() => {
                setActiveReviewDetailModal(null);
                handleStartTopicDrill(selectedTopicId, 3.0);
              }}
            />
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StudentDashboardApp />);
  </script>
</body>

</html>
