<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard - Aegis Learn AI (Python & Artificial Intelligence)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 900: '#312e81' }
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDNs with Fallbacks -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/umd/lucide.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

  <div id="root">
    <div
      style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: #020617; color: #818cf8; font-family: system-ui, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 22px; font-weight: 700; margin-bottom: 8px;">🚀 Aegis Learn AI (Python & AI)</div>
        <div style="font-size: 13px; color: #94a3b8;">Đang tải dữ liệu học tập... Vui lòng chờ trong giây lát</div>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE_URL = "/api/v1";

    // ============================================================
    // 1. QUIZ RESULT MODAL (MÀN HÌNH KẾT QUẢ TỨC THÌ)
    // ============================================================
    function QuizResultModal({ result, onReviewDetails, onRetake, onClose }) {
      if (!result) return null;
      const scorePercentage = result.score || 0;
      const passed = result.passed ?? (scorePercentage >= 60);

      const formatDuration = (seconds) => {
        if (!seconds) return "0 phút 0s";
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m} phút ${s}s`;
      };

      return (
        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl space-y-6 text-center animate-in fade-in zoom-in duration-200">
            <div className="space-y-2">
              <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500/20 to-violet-500/20 border border-indigo-500/30 text-3xl shadow-inner">
                {passed ? "🎉" : "💪"}
              </div>
              <h2 className="text-xl sm:text-2xl font-extrabold text-white tracking-tight">
                {passed ? "Chúc mừng! Bạn đã hoàn thành bài thi" : "Kết quả Bài kiểm tra"}
              </h2>
              <p className="text-xs text-slate-400 font-medium">
                {result.quiz_title || "Bài kiểm tra Đánh giá Kiến thức"}
              </p>
            </div>

            <div className={`p-6 rounded-2xl border ${passed ? 'bg-emerald-950/30 border-emerald-500/30 text-emerald-400' : 'bg-rose-950/30 border-rose-500/30 text-rose-400'} space-y-2`}>
              <div className="text-4xl sm:text-5xl font-black tracking-tight">{scorePercentage}%</div>
              <div className="flex items-center justify-center gap-2">
                <span className={`px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${passed ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-rose-500/20 text-rose-300 border border-rose-500/40'}`}>
                  {passed ? "✓ ĐẠT (PASSED)" : "✗ CẦN CẢI THIỆN (FAILED)"}
                </span>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3 text-left">
              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-1">
                <span className="text-[11px] text-slate-400 font-semibold block">Số câu trả lời đúng</span>
                <div className="text-lg font-bold text-white flex items-center gap-1.5">
                  <span className="text-indigo-400 font-extrabold">{result.correct_count}</span>
                  <span className="text-slate-500 text-xs">/ {result.total_questions} câu</span>
                </div>
              </div>

              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-1">
                <span className="text-[11px] text-slate-400 font-semibold block">Thời gian làm bài</span>
                <div className="text-sm font-bold text-slate-200">{formatDuration(result.duration_seconds)}</div>
              </div>
            </div>

            <div className="space-y-3 pt-2">
              <button
                onClick={onReviewDetails}
                className="w-full bg-gradient-to-r from-indigo-600 via-violet-600 to-purple-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold py-3.5 px-5 rounded-2xl transition shadow-xl shadow-indigo-600/30 text-xs sm:text-sm flex items-center justify-center gap-2 transform active:scale-95"
              >
                <span>🔍 Xem chi tiết đáp án & Lời giải</span>
                <span>→</span>
              </button>

              <div className="flex gap-3">
                <button onClick={onRetake} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3 px-4 rounded-2xl transition text-xs border border-slate-700 active:scale-95">
                  🔄 Làm lại bài thi
                </button>
                <button onClick={onClose} className="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 font-semibold px-5 py-3 rounded-2xl transition text-xs border border-slate-700">
                  Đóng
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // 2. QUIZ REVIEW SCREEN (CHẾ ĐỘ XEM CHI TIẾT ĐÁP ÁN & LỜI GIẢI)
    // ============================================================
    function QuizReviewScreen({ attemptDetail, onClose, onRetake }) {
      if (!attemptDetail) return null;
      const { quiz_title, score, passed, correct_count, total_questions, duration_seconds, created_at, review_questions = [] } = attemptDetail;

      const formatDuration = (seconds) => {
        if (!seconds) return "0m 0s";
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}m ${s}s`;
      };

      return (
        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-4xl w-full shadow-2xl space-y-6 my-auto max-h-[92vh] flex flex-col overflow-hidden">
            <div className="bg-slate-950/90 px-6 py-4 border-b border-slate-800 flex justify-between items-center shrink-0">
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold font-mono text-indigo-400 bg-indigo-500/10 px-2.5 py-0.5 rounded border border-indigo-500/20">LẦN THI CHUẨN ĐOÁN</span>
                  <span className="text-xs text-slate-400">{created_at}</span>
                </div>
                <h2 className="text-lg sm:text-xl font-bold text-white mt-1">🔍 Lời Giải Chi Tiết: {quiz_title || "Bài kiểm tra"}</h2>
              </div>
              <button onClick={onClose} className="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition font-bold">✕</button>
            </div>

            <div className="px-6 shrink-0">
              <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-wrap justify-between items-center gap-4 text-xs">
                <div className="flex items-center gap-3">
                  <span className={`text-2xl font-black ${passed ? 'text-emerald-400' : 'text-rose-400'}`}>{score}%</span>
                  <span className={`px-3 py-1 rounded-xl text-[11px] font-bold ${passed ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-300 border border-rose-500/20'}`}>
                    {passed ? "✓ ĐẠT" : "✗ CẦN CẢI THIỆN"}
                  </span>
                </div>
                <div className="flex items-center gap-6 text-slate-300">
                  <div><span className="text-slate-400 block text-[10px] uppercase font-semibold">Kết quả</span><span className="font-bold text-white">{correct_count} / {total_questions} câu đúng</span></div>
                  <div><span className="text-slate-400 block text-[10px] uppercase font-semibold">Thời gian</span><span className="font-bold text-white">{formatDuration(duration_seconds)}</span></div>
                </div>
              </div>
            </div>

            <div className="px-6 overflow-y-auto space-y-6 flex-1 pr-3">
              {review_questions.map((q, idx) => {
                const isUserCorrect = q.is_correct;
                const optionsObj = q.options || {};
                const optionKeys = Object.keys(optionsObj);

                return (
                  <div key={q.question_id || idx} className={`p-5 rounded-2xl border transition ${isUserCorrect ? 'bg-slate-950/70 border-emerald-500/30' : 'bg-slate-950/70 border-rose-500/30'} space-y-4`}>
                    <div className="flex justify-between items-start gap-3 border-b border-slate-800/80 pb-3">
                      <div className="flex items-center gap-2">
                        <span className="w-7 h-7 rounded-xl bg-slate-800 text-indigo-400 font-bold font-mono text-xs flex items-center justify-center border border-slate-700">{idx + 1}</span>
                        <span className="text-xs font-semibold text-slate-400">Câu hỏi {idx + 1} / {total_questions}</span>
                      </div>
                      <span className={`px-3 py-1 rounded-xl text-xs font-bold ${isUserCorrect ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}`}>
                        {isUserCorrect ? "✓ Đúng (+10 điểm)" : "✗ Sai"}
                      </span>
                    </div>

                    <p className="text-sm sm:text-base font-bold text-white leading-relaxed">{q.question_text || q.content}</p>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5 pt-1">
                      {optionKeys.map((key) => {
                        const optionVal = optionsObj[key];
                        const isSelected = (q.selected_answer === key);
                        const isCorrectOption = (q.correct_answer === key);

                        let cardStyle = "bg-slate-900 border-slate-800 text-slate-300";
                        let badgeStyle = "bg-slate-800 text-slate-400";
                        let iconSymbol = null;

                        if (isCorrectOption) {
                          cardStyle = "bg-emerald-950/40 border-emerald-500 text-emerald-200 font-bold ring-1 ring-emerald-500/50 shadow-md shadow-emerald-500/10";
                          badgeStyle = "bg-emerald-500 text-slate-950 font-black";
                          iconSymbol = <span className="text-emerald-400 font-bold text-xs">✓ (Đáp án đúng)</span>;
                        } else if (isSelected && !isUserCorrect) {
                          cardStyle = "bg-rose-950/40 border-rose-500 text-rose-200 font-semibold ring-1 ring-rose-500/40";
                          badgeStyle = "bg-rose-500 text-white font-black";
                          iconSymbol = <span className="text-rose-400 font-bold text-xs">✗ (Bạn chọn sai)</span>;
                        }

                        return (
                          <div key={key} className={`p-3 rounded-xl border flex items-center justify-between gap-3 text-xs transition ${cardStyle}`}>
                            <div className="flex items-center gap-2.5">
                              <span className={`w-6 h-6 rounded-lg text-xs font-mono font-bold flex items-center justify-center shrink-0 ${badgeStyle}`}>{key}</span>
                              <span className="leading-snug">{optionVal}</span>
                            </div>
                            {iconSymbol && <div className="shrink-0">{iconSymbol}</div>}
                          </div>
                        );
                      })}
                    </div>

                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-1.5 text-xs text-slate-300 leading-relaxed shadow-inner">
                      <div className="flex items-center gap-1.5 text-amber-400 font-bold">
                        <span>💡 Lời giải & Giải thích chi tiết (Pedagogical Explanation):</span>
                      </div>
                      <p className="text-slate-200 pl-1 border-l-2 border-amber-500/60 font-medium">
                        {q.explanation || "Đáp án đúng được xác định dựa trên nguyên lý sư phạm & chuẩn dữ liệu Python AI."}
                      </p>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="bg-slate-950/90 px-6 py-4 border-t border-slate-800 flex justify-between items-center gap-4 shrink-0">
              <button onClick={onClose} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-5 py-2.5 rounded-xl transition text-xs border border-slate-700">← Quay lại</button>
              {onRetake && (
                <button onClick={onRetake} className="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold px-6 py-2.5 rounded-xl transition shadow-lg text-xs">
                  🔄 Thử lại bài thi này
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // 3. QUIZ HISTORY TAB (TRANG LỊCH SỬ LÀM BÀI ĐÃ THI)
    // ============================================================
    function QuizHistoryTab({ historyList = [], onReviewAttempt, onRetakeQuiz, loading, onRefresh }) {
      const formatDuration = (seconds) => {
        if (!seconds) return "0 phút 0s";
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m} phút ${s}s`;
      };

      const getScoreBadge = (score) => {
        const s = parseFloat(score) || 0;
        if (s >= 80.0) {
          return (
            <span className="bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-xl text-xs font-black inline-flex items-center gap-1">
              <span>{s}%</span>
              <span className="text-[10px] bg-emerald-500/20 px-1.5 py-0.5 rounded font-bold">Giỏi</span>
            </span>
          );
        } else if (s >= 60.0) {
          return (
            <span className="bg-amber-500/15 text-amber-300 border border-amber-500/30 px-3 py-1 rounded-xl text-xs font-black inline-flex items-center gap-1">
              <span>{s}%</span>
              <span className="text-[10px] bg-amber-500/20 px-1.5 py-0.5 rounded font-bold">Khá / Đạt</span>
            </span>
          );
        } else {
          return (
            <span className="bg-rose-500/15 text-rose-300 border border-rose-500/30 px-3 py-1 rounded-xl text-xs font-black inline-flex items-center gap-1">
              <span>{s}%</span>
              <span className="text-[10px] bg-rose-500/20 px-1.5 py-0.5 rounded font-bold">Chưa đạt</span>
            </span>
          );
        }
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-5">
            <div>
              <div className="text-indigo-400 font-semibold text-xs tracking-wider uppercase flex items-center gap-1.5">
                <span>📜 Lịch sử Thi & Đánh giá Năng lực</span>
              </div>
              <h2 className="text-xl sm:text-2xl font-bold text-white mt-1">Quản lý Lịch sử Bài Kiểm Tra Trắc Nghiệm 📊</h2>
              <p className="text-xs text-slate-400 mt-1">
                Theo dõi tiến trình điểm số, thời gian làm bài và bấm nút để mở lại đáp án & lời giải chi tiết của bất kỳ lần thi nào.
              </p>
            </div>
            {onRefresh && (
              <button onClick={onRefresh} className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-4 py-2.5 rounded-xl transition border border-slate-700 flex items-center gap-1.5 shrink-0">
                <span>🔄 Cập nhật lịch sử</span>
              </button>
            )}
          </div>

          {loading ? (
            <div className="p-12 text-center text-slate-400 space-y-3">
              <div className="animate-spin text-2xl">🌀</div>
              <p className="text-xs">Đang tải lịch sử thi của bạn...</p>
            </div>
          ) : historyList.length === 0 ? (
            <div className="bg-slate-950 p-10 rounded-2xl border border-slate-800 text-center space-y-3">
              <span className="text-3xl">📝</span>
              <h3 className="text-base font-bold text-white">Chưa có lịch sử làm bài</h3>
              <p className="text-xs text-slate-400 max-w-md mx-auto">Bạn chưa thực hiện bài kiểm tra trắc nghiệm nào. Hãy truy cập Trung tâm Kiểm tra để bắt đầu làm bài đầu tiên!</p>
            </div>
          ) : (
            <div className="overflow-x-auto rounded-2xl border border-slate-800 bg-slate-950">
              <table className="w-full text-left border-collapse text-xs text-slate-300">
                <thead>
                  <tr className="bg-slate-900/80 text-slate-400 font-bold border-b border-slate-800 uppercase text-[11px] tracking-wider">
                    <th className="py-4 px-4 sm:px-6">Tên Bài kiểm tra / Chủ đề</th>
                    <th className="py-4 px-4">Ngày giờ nộp bài</th>
                    <th className="py-4 px-4 text-center">Điểm số</th>
                    <th className="py-4 px-4 text-center">Số câu đúng</th>
                    <th className="py-4 px-4">Thời gian</th>
                    <th className="py-4 px-4 sm:px-6 text-right">Thao tác</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {historyList.map((item) => (
                    <tr key={item.attempt_id} className="hover:bg-slate-900/60 transition group">
                      <td className="py-4 px-4 sm:px-6 font-bold text-white">
                        <div className="flex items-center gap-2">
                          <span className="w-2 h-2 rounded-full bg-indigo-500"></span>
                          <span>{item.quiz_title || `Bài kiểm tra #${item.quiz_id}`}</span>
                        </div>
                      </td>
                      <td className="py-4 px-4 text-slate-400 font-mono text-[11px]">{item.created_at || "Vừa xong"}</td>
                      <td className="py-4 px-4 text-center">{getScoreBadge(item.score)}</td>
                      <td className="py-4 px-4 text-center font-semibold text-slate-200">
                        <span className="text-indigo-400 font-bold">{item.correct_count}</span> / {item.total_questions} câu
                      </td>
                      <td className="py-4 px-4 text-slate-300 font-medium">⏱️ {formatDuration(item.duration_seconds)}</td>
                      <td className="py-4 px-4 sm:px-6 text-right">
                        <div className="flex justify-end items-center gap-2">
                          <button onClick={() => onReviewAttempt && onReviewAttempt(item.attempt_id)} className="bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white border border-indigo-500/30 font-bold px-3.5 py-1.5 rounded-xl transition text-xs flex items-center gap-1 shadow-sm">
                            <span>🔍 Xem lại bài làm</span>
                          </button>
                          <button onClick={() => onRetakeQuiz && onRetakeQuiz(item.quiz_id)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-medium px-3 py-1.5 rounded-xl transition text-xs border border-slate-700">
                            <span>🔄 Làm lại</span>
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    function StudentDashboardApp() {
      const [loading, setLoading] = useState(true);
      const [learningPathData, setLearningPathData] = useState(null);
      const [recommendations, setRecommendations] = useState([]);
      const [spacedRepetition, setSpacedRepetition] = useState(null);
      const [progressReport, setProgressReport] = useState(null);
      const [selectedTopicId, setSelectedTopicId] = useState(103);
      const [searchQuery, setSearchQuery] = useState("");
      const [topKCount, setTopKCount] = useState(6);

      // Search Page View States
      const [activeView, setActiveView] = useState("DASHBOARD"); // "DASHBOARD" | "SEARCH_RESULTS"
      const [searchResultsList, setSearchResultsList] = useState([]);
      const [isSearching, setIsSearching] = useState(false);
      const [searchFilterTopic, setSearchFilterTopic] = useState(0);

      // Lesson Viewer Modal State
      const [selectedMaterialModal, setSelectedMaterialModal] = useState(null);
      const [lessonNoteInput, setLessonNoteInput] = useState("");

      // Exam Center & Assessments State
      const [availableAssessments, setAvailableAssessments] = useState(null);
      const [examTab, setExamTab] = useState("WEEKLY"); // WEEKLY | MONTHLY | PRACTICE
      const [practiceDifficulty, setPracticeDifficulty] = useState(2.0);

      // Quiz Player Modal States
      const [activeQuiz, setActiveQuiz] = useState(null);
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [timerSeconds, setTimerSeconds] = useState(900);
      const [showSubmitConfirm, setShowSubmitConfirm] = useState(false);
      const [quizResult, setQuizResult] = useState(null);

      // Quiz Instant Result & History Modals State
      const [instantQuizResultModal, setInstantQuizResultModal] = useState(null);
      const [activeReviewDetailModal, setActiveReviewDetailModal] = useState(null);
      const [quizHistoryList, setQuizHistoryList] = useState([]);
      const [isHistoryLoading, setIsHistoryLoading] = useState(false);

      // Project Submission Modal
      const [projectSubmitModal, setProjectSubmitModal] = useState(null);
      const [projectSubmissionUrl, setProjectSubmissionUrl] = useState("");
      const [projectReportText, setProjectReportText] = useState("");

      // Personal Notes & Feedback
      const [noteText, setNoteText] = useState("");
      const [notesList, setNotesList] = useState([
        { id: 1, title: "Ghi nhớ Gradient Descent trong AI", content: "Cập nhật trọng số w_new = w_old - alpha * dw để tối ưu hàm mất mát MSE." }
      ]);
      const [showFeedbackModal, setShowFeedbackModal] = useState(false);
      const [feedbackDesc, setFeedbackDesc] = useState("");

      // Mastered Topic IDs & Step Quiz Tracking (Xác minh hoàn thành bài học)
      const [masteredTopicIds, setMasteredTopicIds] = useState([101, 102]);

      // Helper format Markdown cho tin nhắn Gia sư AI
      const renderFormattedAiContent = (text) => {
        if (!text) return null;
        const parts = text.split(/(```[\s\S]*?```)/g);
        return parts.map((part, index) => {
          if (part.startsWith('```') && part.endsWith('```')) {
            const lines = part.slice(3, -3).trim().split('\n');
            const lang = lines[0].trim();
            const code = (lang && !lang.includes(' ') && lines.length > 1) ? lines.slice(1).join('\n') : lines.join('\n');
            return (
              <div key={index} className="my-3 rounded-xl overflow-hidden border border-slate-800 bg-slate-950 shadow-md">
                <div className="bg-slate-900/90 px-3.5 py-1.5 flex justify-between items-center text-[11px] text-slate-400 border-b border-slate-800">

                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(code);
                      setCopiedCodeId(index);
                      setTimeout(() => setCopiedCodeId(null), 2000);

                    className="hover:text-white transition flex items-center gap-1 font-medium text-[11px]"

                  <code>{code}</code>
                </pre>
              </div>
            );

          const lines = part.split('\n');
          return (
            <div key={index} className="space-y-1.5">
              {lines.map((line, lIdx) => {
                if (line.startsWith('### ')) {
                  return <h4 key={lIdx} className="text-base font-bold text-white mt-3 mb-1.5 flex items-center gap-1.5">{line.replace('### ', '')}</h4>;

                }
                if (line.startsWith('- ') || line.startsWith('* ')) {
                  return (
                    <div key={lIdx} className="flex items-start gap-2 ml-2 text-xs text-slate-300 leading-relaxed">
                      <span className="text-indigo-400 mt-1">•</span>

                    <div className={`p-3 rounded-2xl max-w-[92%] ${msg.role === 'user' ? 'bg-indigo-600 text-white font-medium' : 'bg-slate-900 border border-slate-800 text-slate-200 shadow-md'}`}>
                      {msg.role === 'user' ? (
                        <p className="text-xs whitespace-pre-wrap">{msg.content}</p>
                      ) : (
                        <div className="text-xs leading-relaxed space-y-2">
                          {renderFormattedAiContent(msg.content)}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
                {isAiThinking && <p className="text-[11px] text-indigo-400 animate-pulse flex items-center gap-2 font-medium">🤖 Gia sư AI đang phân tích cặn kẽ và soạn bài giảng...</p>}
              </div>

              {/* Mini Input */}
              <div className="p-2 border-t border-slate-800 bg-slate-900 flex gap-2">
                <input
                  type="text"
                  value={chatInput}
                  onChange={(e) => setChatInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter') handleSendChatMessage(); }}
                  placeholder="Hỏi nhanh AI..."
                  className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white outline-none"
                />
                <button onClick={() => handleSendChatMessage()} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3.5 py-1.5 rounded-xl font-bold">
                  Gửi
                </button>
              </div>
            </div>
          )}

          {/* INSTANT RESULT MODAL */}
          {instantQuizResultModal && (
            <QuizResultModal
              result={instantQuizResultModal}
              onReviewDetails={() => {
                setActiveReviewDetailModal(instantQuizResultModal);
                setInstantQuizResultModal(null);
              }}
              onRetake={() => {
                setInstantQuizResultModal(null);
                handleStartTopicPractice(101, 2.0);
              }}
              onClose={() => setInstantQuizResultModal(null)}
            />
          )}

          {/* DETAILED QUIZ REVIEW SCREEN MODAL */}
          {activeReviewDetailModal && (
            <QuizReviewScreen
              attemptDetail={activeReviewDetailModal}
              onClose={() => setActiveReviewDetailModal(null)}
              onRetake={() => {
                setActiveReviewDetailModal(null);
                handleStartTopicPractice(101, 2.0);
              }}
            />
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StudentDashboardApp />);
  </script>
</body>

</html>
